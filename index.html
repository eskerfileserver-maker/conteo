<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex,nofollow">
<title>Conteo de stock · weis</title>
<style>
:root{--azul:#000;--azul2:#3d3d3d;--fondo:#f2f2f2;--carta:#fff;--texto:#111827;--suave:#6b7280;--linea:#e5e7eb;--ok:#000;--okf:#e6e6e6;--mal:#c81e1e;--malf:#fde8e8;--av:#92400e;--avf:#fef3c7}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fondo);color:var(--texto);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:12px 16px;background:var(--azul);color:#fff;font-weight:600;touch-action:manipulation}
button.sec{background:#e9e9e9;color:#000}
button.peligro{background:var(--mal)}
button:disabled{opacity:.45}
input{font:inherit;padding:12px;border:1px solid #cfcfcf;border-radius:10px;width:100%;background:#fff;color:var(--texto)}
input:focus{outline:2px solid var(--azul2);border-color:transparent}
header{position:sticky;top:0;z-index:20;background:#000;color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}
header .marca{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
header .marca svg{height:20px;width:auto;flex:none}
header .marca span{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;opacity:.75;border-left:1px solid rgba(255,255,255,.35);padding-left:10px;white-space:nowrap}
body.login header{display:none}
body{min-height:100vh}
body.login{background:#000}
.hero{color:#fff;text-align:center;padding:48px 8px 28px}
.hero svg{width:210px;max-width:62vw;height:auto}
.hero h1{font-size:22px;font-weight:700;margin:26px 0 4px;letter-spacing:.01em}
.hero p{margin:0;font-size:14px;opacity:.65}
body.login .carta{border-radius:16px;padding:18px}
body.login #cat-estado{color:#9a9a9a;text-align:center}
body.login #entrar{padding:15px;font-size:17px}
header .quien{font-size:13px;opacity:.85}
header button{padding:7px 12px;font-size:13px;background:rgba(255,255,255,.14)}
#modo{display:none;background:var(--avf);color:var(--av);font-size:13px;font-weight:700;text-align:center;padding:6px 16px;border-bottom:1px solid #f3d27a}
#modo.real{background:var(--mal);color:#fff;border-bottom-color:#9b1c1c}
.hero .etq{display:inline-block;margin-top:12px;background:#facc15;color:#000;font-size:12px;font-weight:800;letter-spacing:.1em;padding:3px 10px;border-radius:99px}
main{padding:12px 16px 120px;max-width:720px;margin:0 auto}
.carta{background:var(--carta);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.pant{display:none}.pant.on{display:block}
label{display:block;font-size:14px;color:var(--suave);margin:10px 0 4px}
.err{color:var(--mal);font-size:14px;margin-top:8px;min-height:1em}
.nota{font-size:13px;color:var(--suave)}
.fila{display:flex;gap:8px;align-items:center}
.fila>input{flex:1}
#camara{position:relative;background:#000;border-radius:12px;overflow:hidden;display:none;margin-bottom:10px}
#camara video{width:100%;height:42vh;object-fit:cover;display:block}
#camara .mira{position:absolute;left:10%;right:10%;top:38%;bottom:38%;border:2px solid rgba(255,255,255,.8);border-radius:8px;pointer-events:none}
#camara .ctl{position:absolute;right:8px;top:8px;display:flex;gap:6px}
#camara .ctl button{padding:10px 14px;font-size:15px;background:rgba(0,0,0,.6)}
#camara .ctl button.on{background:#facc15;color:#111}
#ultimo{position:absolute;left:8px;right:8px;bottom:8px;background:rgba(0,0,0,.65);color:#fff;border-radius:8px;padding:8px 10px;font-size:15px;display:none}
#ultimo b{font-size:20px}
#camara video{cursor:pointer}
#tocar{position:absolute;left:0;right:0;top:60px;text-align:center;color:#fff;font-size:14px;font-weight:600;text-shadow:0 1px 3px #000;pointer-events:none}
#camara.leyendo .mira{border-color:#facc15;border-width:3px}
#camara.leido .mira{border-color:#fff;border-width:6px;box-shadow:0 0 0 3px #000}
#camara.fallo .mira{border-color:#ef4444;border-width:4px}
.btnes{display:flex;gap:8px}.btnes>button{flex:1}
#sug,#sug-p{margin-top:6px}
#sug div,#sug-p div{padding:10px;border-bottom:1px solid var(--linea);font-size:14px}
#sug div:active{background:#eee}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.item{background:var(--carta);border-radius:12px;padding:10px 12px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.06);border-left:5px solid transparent}
.item.alerta{border-left-color:var(--mal)}
.item.igual{border-left-color:var(--ok)}
.item .sup{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.item .sku{font-weight:700;font-size:15px;word-break:break-all}
.item .nom{font-size:13px;color:var(--suave);margin-top:2px}
.item .x{background:none;color:var(--suave);padding:2px 6px;font-size:20px;line-height:1}
.item .inf{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px}
.item .sis{font-size:13px;color:var(--suave)}
.cant{display:flex;align-items:center;gap:4px}
.cant button{width:44px;height:44px;padding:0;font-size:22px;background:#e9e9e9;color:#000}
.cant input{width:64px;text-align:center;font-size:20px;font-weight:700;padding:8px 4px}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px}
.chip.ok{background:var(--okf);color:var(--ok)}.chip.mal{background:var(--malf);color:var(--mal)}.chip.av{background:var(--avf);color:var(--av)}.chip.gr{background:#eef0f3;color:#374151}
.pie{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--linea);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.pie .res{font-size:13px;color:var(--suave);margin-bottom:6px;text-align:center}
.pie .in{max-width:720px;margin:0 auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 4px;border-bottom:1px solid var(--linea);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--suave);font-weight:600}
td.n,th.n{text-align:right}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.modal .caja{background:#fff;width:100%;max-width:720px;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:85vh;overflow:auto}
.modal h3{margin:0 0 8px;font-size:17px}
.opc{display:block;width:100%;text-align:left;margin-bottom:8px;background:#efefef;color:var(--texto);font-weight:400}
.opc b{display:block}
#aviso{position:fixed;left:16px;right:16px;bottom:calc(104px + env(safe-area-inset-bottom));z-index:60;display:none;padding:12px 14px;border-radius:10px;font-size:15px;font-weight:600;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.chk{display:flex;gap:10px;align-items:flex-start;background:var(--malf);border-radius:10px;padding:12px;margin:10px 0;font-size:15px}
.chk input{width:26px;height:26px;flex:none;margin:0}
.vacio{text-align:center;color:var(--suave);padding:24px 8px;font-size:14px}
/* inicio y consulta de precio (03/11) */
.inicio h2{font-size:15px;color:var(--suave);font-weight:600;margin:6px 0 14px}
.opcion{display:flex;align-items:center;gap:16px;width:100%;text-align:left;padding:22px 18px;margin-bottom:12px;border-radius:16px;background:#fff;color:#000;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.opcion .ic{width:52px;height:52px;border-radius:12px;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.opcion b{display:block;font-size:19px}.opcion small{display:block;font-size:13px;color:var(--suave);font-weight:400;margin-top:3px}
.precio-card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 1px 2px rgba(0,0,0,.08);margin-bottom:12px}
.precio-card .nom{font-size:17px;font-weight:700;line-height:1.25}
.precio-card .sku{font-size:13px;color:var(--suave);margin-top:4px}
.grande{font-size:44px;font-weight:800;letter-spacing:-.02em;margin:10px 0 2px}
.tachado{color:var(--suave);text-decoration:line-through;font-size:18px;display:inline-block;margin-top:12px}
.promo{display:inline-block;background:#000;color:#fff;font-size:13px;font-weight:700;padding:3px 9px;border-radius:99px;margin-left:8px;vertical-align:middle}
.linea{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--linea);font-size:14px}
.linea span{color:var(--suave)}.linea b{text-align:right}
.linea .et{display:flex;align-items:center;gap:10px;flex:none}
.ico{width:28px;height:28px;border-radius:8px;background:#000;color:#fff;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ico svg{width:16px;height:16px}.ico.w svg{width:20px;height:auto}
.aviso-p{background:var(--avf);color:var(--av);border-radius:10px;padding:9px 11px;font-size:13px;font-weight:600;margin-top:10px}
.talles{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.talle{min-width:56px;text-align:center;padding:8px 10px;border-radius:10px;border:1px solid #cfcfcf;font-weight:700;font-size:14px;background:#fff;color:#000}
.talle small{display:block;font-weight:400;font-size:11px;color:var(--suave)}
.talle.sel{background:#000;color:#fff;border-color:#000}.talle.sel small{color:#bbb}
.talle.sin{color:#b5b5b5;border-style:dashed}
.reciente{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--linea);font-size:14px;cursor:pointer}
#cliente{position:fixed;inset:0;z-index:70;background:#000;color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}
#cliente.on{display:flex}
#cliente svg{width:120px;height:auto;opacity:.9}
#cliente .n{font-size:22px;font-weight:700;margin-top:40px;line-height:1.3}
#cliente .tc{font-size:22px;opacity:.55;text-decoration:line-through;margin-top:22px}
#cliente .pr{display:inline-block;background:#fff;color:#000;font-weight:800;padding:4px 12px;border-radius:99px;margin-top:10px;font-size:15px}
#cliente .p{font-size:60px;font-weight:800;letter-spacing:-.02em;margin-top:22px}
#cliente .vig{font-size:13px;opacity:.6;margin-top:24px}
#cliente button{position:absolute;bottom:calc(30px + env(safe-area-inset-bottom));left:30px;right:30px;background:rgba(255,255,255,.14)}
</style>
</head>

// ---------- catalogo ----------
function armarIndice(filas) {
  var sku = new Map(), alias = new Map(), grupos = new Map();
  for (var i = 0; i < filas.length; i++) {
    var f = filas[i], c = f[0];
    if (f[4] === 'C') {
      var ml = null; if (f[10]) { try { ml = JSON.parse(f[10]); var vis = {}; ml.p = (ml.p || []).filter(function (x) { var k = JSON.stringify(x); if (vis[k]) return false; vis[k] = 1; return true; }); } catch (e) { ml = null; } }
      var p = { c: c, n: f[2], t: f[3], p: Number(f[5]) || 0, wl: Number(f[6]) || 0, wv: Number(f[7]) || 0, wf: f[8] || '', g: f[9] || ('F:' + c), ml: ml };
      sku.set(String(c).toLowerCase(), p);
      var gg = grupos.get(p.g) || []; gg.push(p); grupos.set(p.g, gg);
    }
    else { var k = String(f[1]).trim().toLowerCase(); if (!k) continue; var l = alias.get(k) || []; l.push({ c: c, o: f[4] }); alias.set(k, l); }
  }
  return { sku: sku, alias: alias, grupos: grupos, filas: filas };
}
// El catalogo (con precios) se arma todos los dias a las 08:30. Se vuelve a bajar si el que hay
// en el telefono no es de hoy, salvo que se haya bajado hace menos de 30 minutos.
function pintarCat(c) { S.catAct = c.act || ''; S.webUlt = c.web || ''; $('i-cat').textContent = 'Catálogo y precios de Contabilium: ' + fechaCorta(S.catAct) + (S.webUlt ? ' · weis.com.ar relevado: ' + fechaCorta(S.webUlt) : ''); }
function cargarCatalogo() {
  try { localStorage.removeItem('cr_cat_v1'); } catch (e) {}
  var c = leerLS('cr_cat_v2');
  var fresco = c && c.filas && c.filas.length && (String(c.act || '').slice(0, 10) === hoyAR() || Date.now() - (c.bajado || 0) < 30 * 60000);
  if (fresco) { S.cat = armarIndice(c.filas); pintarCat(c); return Promise.resolve(); }
  if (c && c.filas) { S.cat = armarIndice(c.filas); pintarCat(c); }   // se usa el viejo mientras baja el nuevo
  aviso('Bajando catálogo y precios…', 'av');
  return llamar({ accion: 'catalogo' }, 120000).then(function (r) {
    if (!r.ok) throw new Error(r.error || 'No se pudo bajar el catálogo');
    S.cat = armarIndice(r.filas);
    var nuevo = { act: r.actualizado, web: r.web_ultimo || '', bajado: Date.now(), filas: r.filas };
    if (!guardarLS('cr_cat_v2', nuevo)) borrarLS('cr_cat_v2');
    pintarCat(nuevo);
    aviso('Catálogo listo (' + S.cat.sku.size + ' productos)');
  }).catch(function (e) { if (!S.cat) { ['e-conteo', 'e-precio'].forEach(function (id) { $(id).textContent = 'Sin catálogo: ' + e.message + '. Tocá aquí para reintentar.'; $(id).onclick = function () { $(id).textContent = ''; cargarCatalogo(); }; }); } });
}
// Devuelve la lista de SKU posibles para un codigo leido. Prioridad: SKU exacto > codigo de barras > mapeo de remitos.
function resolver(cod) {
  if (!S.cat) return [];
  var k = String(cod).trim().toLowerCase(); if (!k) return [];
  var prueba = [k];
  if (/^\d+$/.test(k)) { if (k.length === 12) prueba.push('0' + k); if (k.length === 13 && k[0] === '0') prueba.push(k.slice(1)); }
  for (var i = 0; i < prueba.length; i++) { var s = S.cat.sku.get(prueba[i]); if (s) return [s]; }
  var orden = ['B', 'M'];
  for (var j = 0; j < orden.length; j++) {
    var vistos = {}, out = [];
    for (var i2 = 0; i2 < prueba.length; i2++) (S.cat.alias.get(prueba[i2]) || []).forEach(function (a) {
      if (a.o === orden[j] && !vistos[a.c]) { var p = S.cat.sku.get(String(a.c).toLowerCase()); if (p) { vistos[a.c] = 1; out.push(p); } }
    });
    if (out.length) return out;
  }
  return [];
}
function buscar(txt) {
  if (!S.cat || txt.length < 3) return [];
  var q = txt.toLowerCase(), out = [], palabras = q.split(/\s+/).filter(Boolean);
  S.cat.sku.forEach(function (p) {
    if (out.length >= 30) return;
    var c = p.c.toLowerCase(), n = String(p.n).toLowerCase();
    if (c.indexOf(q) === 0 || palabras.every(function (w) { return c.indexOf(w) >= 0 || n.indexOf(w) >= 0; })) out.push(p);
  });
  out.sort(function (a, b) { return (a.c.toLowerCase().indexOf(q) === 0 ? 0 : 1) - (b.c.toLowerCase().indexOf(q) === 0 ? 0 : 1); });
  return out.slice(0, 8);
}

    S.items.forEach(function (i) { i.st = null; });
    h += S.items.length ? '<p>Quedaron en la lista los ' + S.items.length + ' SKU con problemas. <b>Revisalos antes de volver a aplicar</b>: algunos pueden haberse escrito igual.</p>' : '<p>Conteo cerrado.</p>';
  } else if (r.estado === 'NO APLICADO') {
    S.items.forEach(function (i) { i.st = null; });
    h += '<p><b>No se escribió nada.</b> El stock cambió mientras contabas y aparecieron alertas nuevas. Revisá y volvé a confirmar.</p>';
  } else if (r.estado === 'SIMULADO') {
    h += '<p>Simulación: no se escribió nada. El conteo sigue abierto.</p>';
  }
  guardarConteo(); borrarLS(PFX + 'pendiente_' + S.usuario);
  h += '<button id="fin" style="width:100%;margin-top:10px">' + (S.items.length ? 'Volver al conteo' : 'Nuevo conteo') + '</button>';
  $('resul').innerHTML = h;
  $('fin').onclick = function () { pantalla('p-conteo'); pintarLista(); pedirStock(S.items.filter(function (i) { return !i.st; }).map(function (i) { return i.c; })); };
}

// ---------- arranque ----------
(function () {
  document.title = REAL ? 'Conteo de stock · weis' : 'Práctica de conteo · weis';
  $('h-modo').textContent = REAL ? 'Conteo' : 'Práctica';
  $('s-hero').textContent = REAL ? 'Depósito Principal' : 'No cambia el stock: es para practicar';
  $('t-hero').textContent = REAL ? 'Conteo de stock' : 'Práctica de conteo';
  if (!REAL) $('e-hero').innerHTML = '<span class="etq">PRÁCTICA</span>';
  $('modo').className = REAL ? 'real' : '';
  $('modo').textContent = REAL ? 'REAL: los cambios se escriben en Contabilium' : 'PRÁCTICA: no se escribe nada en Contabilium';
})();
(function () {
  var s = null; try { s = JSON.parse(sessionStorage.getItem(PFX + 'ses') || 'null'); } catch (e) {}
  if (!s) return;
  S.usuario = s.u; S.pin = s.p; S.nombre = s.n; S.modo = s.m; S.umbral = s.um || 5; S.max = s.mx || 200;
  entrarConteo();
  var p = leerLS(PFX + 'pendiente_' + S.usuario); if (p && p.id) seguir(p.id, 0);
})();
</script>
